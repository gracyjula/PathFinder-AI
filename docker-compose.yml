version: '3.9'

services:
  # ─── Database (required) ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: neuralearn_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: neuralearn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neuralearn_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/neuralearn
      SYNC_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/neuralearn
      # Override these in ./backend/.env — never commit real keys
      # GEMINI_API_KEY: your-key-here
      # OPENAI_API_KEY: your-key-here
      FRONTEND_URL: http://localhost
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neuralearn_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
