services:
  - type: web
    name: neuralearn-backend
    runtime: python
    region: oregon   # change to singapore / frankfurt if you want a closer region
    plan: free       # upgrade to starter ($7/mo) for persistent disk & no sleep

    rootDir: .       # render.yaml is inside /backend, so '.' is the backend root

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      # ── App ──────────────────────────────────────────────────────────────────
      - key: APP_NAME
        value: NeuraLearn AI
      - key: APP_VERSION
        value: "1.0.0"
      - key: DEBUG
        value: "false"

      # ── Secret Key (REQUIRED — set a strong random value in Render dashboard)
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a random secret on first deploy

      # ── Database (REQUIRED — attach a Render PostgreSQL database below) ─────
      # Render auto-injects DATABASE_URL when you add a PostgreSQL add-on.
      # The value below is a placeholder; the actual value comes from the DB add-on.
      - key: DATABASE_URL
        fromDatabase:
          name: neuralearn-db
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: neuralearn-db
          property: connectionString

      # ── CORS ─────────────────────────────────────────────────────────────────
      # Set this to your actual Vercel URL after you deploy the frontend.
      # You can add multiple URLs separated by commas.
      - key: FRONTEND_URL
        value: https://neuralearn.vercel.app   # REPLACE with your real Vercel URL

      # ── AI Keys (REQUIRED for AI features — set in Render dashboard) ────────
      - key: GEMINI_API_KEY
        sync: false   # set manually in Render dashboard — never commit to git
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

      # ── JWT ──────────────────────────────────────────────────────────────────
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"

      # ── Redis (optional — only needed if you add Redis-based features) ───────
      # - key: REDIS_URL
      #   value: redis://...

      # ── ChromaDB (optional — only needed if using vector search) ─────────────
      # - key: CHROMA_HOST
      #   value: ...

databases:
  - name: neuralearn-db
    databaseName: neuralearn
    user: neuralearn
    plan: free   # Render Free PostgreSQL — 1GB storage, expires after 90 days
                 # upgrade to starter ($7/mo) for no expiry
